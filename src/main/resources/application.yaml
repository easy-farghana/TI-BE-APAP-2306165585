server:
    port: 8082

spring:
    main:
        allow-circular-references: true
        
    application:
        name: accommodation-be

    mvc:
        hiddenmethod:
            filter:
                enabled: true
    
    profiles:
        active: 'dev'
    
    jpa:
        hibernate:
            ddl-auto: create-drop

accommodation-be:
    app:
        apiKey: "${API_KEY}"

credentials:
    admin-email: "${ADMIN_EMAIL}"
    admin-password: "${ADMIN_PASSWORD}"

external:
    flight-service-url: "${FLIGHT_URL}"
    insurance-service-url: "${INSURANCE_URL}"
    tour-service-url: "${TOUR_URL}"
    rental-service-url: "${RENTAL_URL}"
    auth-service-url: "${AUTH_URL}"
    accommodation-service-url: "${ACCOMMODATION_URL}"

