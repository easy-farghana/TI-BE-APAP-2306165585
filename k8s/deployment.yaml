apiVersion: apps/v1
kind: Deployment
metadata:
  name: accommodation-be
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accommodation-be
  template:
    metadata:
      labels:
        app: accommodation-be
    spec:
      containers:
        - name: springboot-container
          image: mhibrizif/accommodation-be:REPLACE_ME_TAG
          ports:
            - containerPort: 8082
          env:
            - name: DATABASE_URL_PROD
              valueFrom:
                configMapKeyRef:
                  name: accommodation-be-config
                  key: DATABASE_URL_PROD
            - name: DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: accommodation-be-config
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accommodation-be-secret
                  key: DATABASE_PASSWORD
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: accommodation-be-secret
                  key: CORS_ALLOWED_ORIGINS
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: accommodation-be-secret
                  key: API_KEY
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: accommodation-be-secret
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accommodation-be-secret
                  key: ADMIN_PASSWORD
            - name: FLIGHT_URL
              valueFrom:
                configMapKeyRef:
                  name: accommodation-be-config
                  key: FLIGHT_URL
            - name: INSURANCE_URL
              valueFrom:
                configMapKeyRef:
                  name: accommodation-be-config
                  key: INSURANCE_URL
            - name: TOUR_URL
              valueFrom:
                configMapKeyRef:
                  name: accommodation-be-config
                  key: TOUR_URL
            - name: RENTAL_URL
              valueFrom:
                configMapKeyRef:
                  name: accommodation-be-config
                  key: RENTAL_URL
            - name: AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: accommodation-be-config
                  key: AUTH_URL
            - name: ACCOMMODATION_URL
              valueFrom:
                configMapKeyRef:
                  name: accommodation-be-config
                  key: ACCOMMODATION_URL
